<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz : App Inventor</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf6ef;--card:#fff;--ink:#10202e;--muted:#4c6272;--line:#cfe3d7;--head:#0e1f2f;--droid:#3ddc84;--b1:#4a6cd4;--b2:#5ba55b;--b3:#e8901a;--b4:#8e5bc9;--ok:#1f9d57;--okbg:#dff5e8;--ko:#d6364f;--kobg:#fde4e8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b1620;--card:#15283a;--ink:#eaf3f8;--muted:#9fb6c6;--line:#27435a;--okbg:#113a28;--kobg:#431c26}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1620;--card:#15283a;--ink:#eaf3f8;--muted:#9fb6c6;--line:#27435a;--okbg:#113a28;--kobg:#431c26}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Rubik","Segoe UI",Arial,sans-serif;font-weight:500;font-size:17px;line-height:1.5;padding:16px}
.wrap{max-width:740px;margin:0 auto}
header{background:var(--head);color:#fff;border-radius:22px;padding:22px;display:flex;gap:20px;align-items:center;border-bottom:6px solid var(--droid)}
.phone{flex:none;width:84px;height:132px;border:4px solid #5b7488;border-radius:16px;background:#0a1621;padding:10px 8px;display:flex;flex-direction:column;gap:8px;justify-content:center}
.phone i{display:block;height:20px;border-radius:6px}
.phone i:nth-child(1){background:#f0475c}.phone i:nth-child(2){background:#4a8cff}.phone i:nth-child(3){background:#3ddc84}
h1{font-weight:800;font-size:clamp(26px,6vw,38px);line-height:1.08;margin:0 0 10px}
h1 span{color:var(--droid)}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.meta b{border:2px solid #3b566c;border-radius:10px;padding:2px 12px;font-size:14px;font-weight:600}
.meta b.t{background:var(--droid);border-color:var(--droid);color:#06301a}
.steps{display:flex;gap:6px;margin:20px 0 6px}
.steps i{flex:1;height:14px;border-radius:4px 4px 7px 7px;background:var(--line);transition:background .3s}
.steps i.on{background:var(--ok)}.steps i.off{background:var(--ko)}.steps i.cur{background:var(--b1)}
.info{display:flex;justify-content:space-between;font-size:15px;color:var(--muted);margin:0 0 14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px}
.tag{display:inline-block;font-family:"JetBrains Mono",Consolas,monospace;font-weight:600;font-size:14px;background:var(--head);color:var(--droid);border-radius:8px;padding:2px 10px;margin-bottom:10px}
h2{font-weight:600;font-size:clamp(20px,4.6vw,25px);line-height:1.28;margin:0 0 18px}
.opts{display:grid;gap:12px}
.opt{position:relative;display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;font-weight:600;color:#fff;border:0;border-radius:6px 12px 12px 12px;padding:13px 16px 13px 18px;cursor:pointer;margin-top:6px;transition:transform .12s,filter .12s}
.opt::before{content:"";position:absolute;left:16px;top:-6px;width:26px;height:8px;border-radius:5px 5px 0 0;background:inherit}
.opt:nth-child(1){background:var(--b1)}.opt:nth-child(2){background:var(--b2)}.opt:nth-child(3){background:var(--b3)}.opt:nth-child(4){background:var(--b4)}
.opt:nth-child(3){color:#2a1700}
.opt:hover:not(:disabled){transform:translateX(4px);filter:brightness(1.08)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.opt:disabled{cursor:default}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.28);display:grid;place-items:center;font-size:14px;font-weight:800}
.opt.dim{filter:grayscale(1) opacity(.45)}
.opt.ok{outline:4px solid var(--ok);outline-offset:2px}
.opt.ko{outline:4px solid var(--ko);outline-offset:2px;filter:none}
.fb{margin-top:18px;padding:12px 14px;border-radius:12px}
.fb.ok{background:var(--okbg);border-left:6px solid var(--ok)}
.fb.ko{background:var(--kobg);border-left:6px solid var(--ko)}
.fb[hidden],.btn[hidden]{display:none}
code{font-family:"JetBrains Mono",Consolas,monospace;font-size:.9em;background:rgba(80,120,150,.16);border-radius:5px;padding:1px 6px;word-break:break-all}
.btn{margin-top:18px;font:inherit;font-weight:800;font-size:17px;color:#06301a;background:var(--droid);border:0;border-radius:12px;padding:11px 26px;cursor:pointer;box-shadow:0 4px 0 #22a860}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #22a860}
.end{text-align:center}
.score{font-weight:800;font-size:68px;line-height:1;color:var(--ok);margin:6px 0 10px}
footer{text-align:center;color:var(--muted);font-size:14px;margin-top:18px}
.logo{flex:none;background:#fff;border-radius:14px;padding:6px 10px;align-self:flex-start}
.logo img{display:block;width:150px;height:auto}
header{flex-wrap:wrap}
.fig{margin:0 0 18px;text-align:center}
.fig img{max-width:100%;max-height:300px;border-radius:12px;border:2px solid var(--line);background:#fff;object-fit:contain}
.fig.sm img{max-height:90px}
.fig.pair{display:grid;gap:12px}
.fig figcaption{font-size:13px;color:var(--muted);margin-top:4px}
.fb .fig{margin:12px 0 0}
.end .fig{margin:14px 0 0}
@media (max-width:480px){.logo img{width:120px}{.phone{width:64px;height:104px}.phone i{height:15px}header{padding:16px;gap:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="phone" aria-hidden="true"><i></i><i></i><i></i></div>
  <div>
    <h1>Quiz <span>App Inventor</span></h1>
    <div class="meta"><b class="t">Enseignant : Nizar ZOUABI</b><b>Niveau : 9ème année de base</b></div>
  </div>
  <div class="logo"><img id="logo" alt="Logo MIT App Inventor"></div>
</header>

<div class="steps" id="steps"></div>
<div class="info"><span id="pl">Question 1 sur 7</span><span id="ps">Score : 0</span></div>
<main class="card" id="card" aria-live="polite"></main>
<footer>Choisis un bloc-réponse, puis lis l’explication.</footer>
</div>

var i=0,score=0,done=false,res=[];
var card=document.getElementById('card'),steps=document.getElementById('steps');
function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!==undefined)n.textContent=x;return n}
function fig(k,pair){var f=el('figure','fig'+(SM[k]?' sm':''));var m=new Image();m.src=IMG[k];m.alt=CAP[k];f.appendChild(m);f.appendChild(el('figcaption','',CAP[k]));return f}
document.getElementById('logo').src=IMG.logo;
function bar(){
  steps.innerHTML='';
  for(var k=0;k<7;k++){var s=el('i',k<res.length?(res[k]?'on':'off'):(k===i?'cur':''));steps.appendChild(s)}
  document.getElementById('pl').textContent='Question '+Math.min(i+1,7)+' sur 7';
  document.getElementById('ps').textContent='Score : '+score;
}
function show(){
  done=false;bar();card.innerHTML='';
  var d=Q[i];
  card.appendChild(el('span','tag',d.t));
  card.appendChild(el('h2','',d.q));
  if(d.i)card.appendChild(fig(d.i));
  var box=el('div','opts');
  var fb=el('div','fb');fb.hidden=true;
  var nx=el('button','btn',i<6?'Question suivante':'Voir mon résultat');nx.hidden=true;
  d.o.forEach(function(t,k){
    var b=el('button','opt');b.type='button';
    b.appendChild(el('span','l',String.fromCharCode(65+k)));
    var s=el('span','');s.innerHTML=t;b.appendChild(s);
    b.onclick=function(){
      if(done)return;done=true;
      var good=k===d.a;if(good)score++;res.push(good);
      var all=box.children;
      for(var j=0;j<all.length;j++){all[j].disabled=true;if(j===d.a)all[j].classList.add('ok');else if(j!==k)all[j].classList.add('dim')}
      if(!good)b.classList.add('ko');
      fb.className='fb '+(good?'ok':'ko');
      fb.innerHTML=(good?'Bien joué ! ':'Raté. ')+d.e;if(d.ia){var g=el('div','fig pair');d.ia.forEach(function(k){g.appendChild(fig(k))});fb.appendChild(g)}fb.hidden=false;nx.hidden=false;
      var st=steps.children[i];st.className=good?'on':'off';
      document.getElementById('ps').textContent='Score : '+score;nx.focus();
    };
    box.appendChild(b);
  });
  nx.onclick=function(){i++;if(i<7)show();else end()};
  card.appendChild(box);card.appendChild(fb);card.appendChild(nx);
}
function end(){
  bar();card.innerHTML='';card.className='card end';
  var m=score===7?'Parfait ! Tu peux déjà te lancer dans ta première application.':score>=5?'Très bien ! Il ne te manque presque rien.':score>=3?'Pas mal. Relis la leçon et retente ta chance.':'Courage ! Relis la leçon puis recommence le quiz.';
  card.appendChild(el('h2','','Quiz terminé'));
  card.appendChild(el('div','score',score+' / 7'));
  card.appendChild(el('p','',m));
  card.appendChild(fig('code'));
  var r=el('button','btn','Recommencer');
  r.onclick=function(){i=0;score=0;res=[];card.className='card';show()};
  card.appendChild(r);
}
show();
</script>
