<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz : Identité numérique et E-partage</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#1a2540;--mut:#5a6785;--pri:#1e5bb8;--ok:#1b8a4b;--okb:#e1f5e9;--ko:#c62b3a;--kob:#fde8ea;--bd:#d6deec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--card:#18223a;--tx:#e8edf8;--mut:#9aa8c7;--pri:#6fa3f0;--ok:#5fd18d;--okb:#12301f;--ko:#ff7a86;--kob:#3a1a1f;--bd:#2c3a5c}}
:root[data-theme="dark"]{--bg:#0f1626;--card:#18223a;--tx:#e8edf8;--mut:#9aa8c7;--pri:#6fa3f0;--ok:#5fd18d;--okb:#12301f;--ko:#ff7a86;--kob:#3a1a1f;--bd:#2c3a5c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.w{max-width:760px;margin:0 auto;padding:16px}
header{background:var(--pri);color:#fff;border-radius:14px;padding:20px;margin-bottom:16px}
header h1{margin:0 0 4px;font-size:1.4rem}
header p{margin:0;opacity:.9;font-size:.95rem}
.id{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.id input{flex:1;min-width:180px;padding:10px;border-radius:8px;border:0;font-size:1rem}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.q h3{margin:0 0 10px;font-size:1rem}
.q h3 span{color:var(--pri)}
label{display:block;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;margin-bottom:6px;cursor:pointer}
label:hover{border-color:var(--pri)}
input[type=radio]{margin-right:8px}
.q.ok label.good{background:var(--okb);border-color:var(--ok)}
.q.ko label.bad{background:var(--kob);border-color:var(--ko)}
.q.ko label.good{background:var(--okb);border-color:var(--ok)}
.ex{display:none;margin-top:8px;font-size:.9rem;color:var(--mut)}
.q.ok .ex,.q.ko .ex{display:block}
button{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:1rem;cursor:pointer}
button.s{background:transparent;color:var(--pri);border:1px solid var(--pri);margin-left:8px}
#res{display:none;text-align:center;background:var(--card);border:2px solid var(--pri);border-radius:14px;padding:20px;margin-bottom:16px}
#res .n{font-size:2.6rem;font-weight:700;color:var(--pri)}
</style>
</head>
<body>
<div class="w">
<header>
<h1>Quiz : Identité numérique et E-partage</h1>
<p>20 questions · 1 point par bonne réponse · Note sur 20</p>
<div class="id"><input id="nom" placeholder="Nom et prénom de l’élève" aria-label="Nom et prénom"></div>
</header>
<div id="res"><div id="who"></div><div class="n" id="note"></div><div id="msg"></div></div>
<div id="qs"></div>
<button id="go">Valider mes réponses</button><button class="s" id="re" style="display:none">Recommencer</button>
</div>
<script>
var Q=[
["Quel outil sert de mur virtuel pour partager des idées et des ressources ?",["Webroom","Padlet","Bubbl.us","Google Drive"],1,"Padlet est un mur virtuel de partage."],
["Google Drive est un outil de…",["visioconférence","carte mentale","stockage et partage de fichiers en ligne","messagerie"],2,"Google Drive permet de stocker et partager des fichiers."],
["Webroom permet de…",["communiquer à distance (visioconférence)","stocker des fichiers","dessiner des cartes mentales","bloquer les traqueurs"],0,"Webroom est un outil de visioconférence."],
["Quel outil permet d’organiser des idées sous forme de schéma (carte mentale collaborative) ?",["Padlet","Webroom","Bubbl.us","Ghostery"],2,"Bubbl.us est une carte mentale collaborative."],
["Google Classroom est…",["un navigateur","une plateforme d’enseignement en ligne","un réseau social","un moteur de recherche"],1,"Elle permet de partager des cours, donner des devoirs et communiquer avec les élèves."],
["Pour rejoindre une classe sur Google Classroom, il faut se connecter avec…",["un compte Google et le code fourni par l’enseignant","n’importe quel pseudo sans compte","une adresse IP","un cookie"],0,"On se connecte avec un compte Google puis on utilise le code de la classe."],
["Une interaction numérique est…",["un virus informatique","une action réalisée à l’aide d’un appareil numérique ou sur Internet","un cookie de navigation","un mot de passe"],1,"C’est toute action réalisée avec un appareil numérique ou sur Internet."],
["Une trace numérique est…",["une information laissée par un utilisateur lorsqu’il utilise un appareil ou un service en ligne","un fichier supprimé","une erreur système","une photo imprimée"],0,"Toute utilisation laisse des informations."],
["Lequel est un exemple de trace VOLONTAIRE ?",["L’adresse IP","Les cookies","La localisation collectée","Publier une photo"],3,"Publier une photo est un acte volontaire de l’utilisateur."],
["Lequel est un exemple de trace INVOLONTAIRE ou automatique ?",["Écrire un commentaire","Remplir un formulaire avec son nom","L’adresse IP","Publier une vidéo"],2,"L’adresse IP est enregistrée automatiquement."],
["L’identité numérique est…",["l’ensemble des informations et traces qui représentent une personne sur Internet","uniquement le mot de passe","le numéro de l’appareil","la vitesse de connexion"],0,"Elle regroupe nom, photo de profil, publications, comptes, etc."],
["Quel élément fait partie de l’identité numérique ?",["Les publications et commentaires","La couleur de l’écran","La marque de l’ordinateur","La taille du clavier"],0,"Publications, commentaires, profils et comptes forment l’identité numérique."],
["Récupérer des informations privées et les utiliser sans autorisation s’appelle…",["la publicité ciblée","le vol de données personnelles","la perte de vie privée","le partage collaboratif"],1,"C’est le vol des données personnelles."],
["Utiliser des photos ou des messages pour se moquer de quelqu’un ou lui faire du mal, c’est…",["de la publicité ciblée","du cyberharcèlement","du travail collaboratif","de la visioconférence"],1,"C’est du cyberharcèlement."],
["Les informations collectées servent à proposer des annonces adaptées aux intérêts de l’utilisateur : c’est…",["l’atteinte à la réputation","le cyberharcèlement","la publicité ciblée","le vol d’identité"],2,"C’est la publicité ciblée."],
["Une ancienne photo inappropriée qui nuit à l’image d’une personne illustre…",["la publicité ciblée","l’atteinte à la réputation","un bon réglage de confidentialité","un outil collaboratif"],1,"C’est l’atteinte à la réputation."],
["Un élève publie une photo avec son adresse et le nom de son école. Quel risque ?",["Aucun risque","Perte de vie privée : une personne inconnue peut identifier ses lieux habituels","Le Wi-Fi sera plus rapide","Son compte Google Classroom sera supprimé"],1,"Ces informations peuvent révéler ses habitudes et ses déplacements."],
["Quelle est une bonne habitude pour limiter sa traçabilité ?",["Publier son numéro de téléphone","Accepter tous les cookies","Vérifier les paramètres de confidentialité des comptes","Rester connecté en permanence"],2,"On vérifie la confidentialité, on limite les informations visibles et on se déconnecte."],
["Lightbeam est un outil qui permet de…",["bloquer toutes les publicités","observer les relations entre les sites visités et les services tiers","créer des cartes mentales","stocker des fichiers"],1,"Lightbeam visualise les liens entre sites visités et services tiers."],
["Ghostery est une extension de navigateur qui…",["détecte et peut bloquer des traqueurs et certaines publicités","garantit un anonymat complet","remplace Google Classroom","crée des présentations"],0,"Ghostery protège la vie privée, mais ne garantit pas un anonymat complet."]
];
var box=document.getElementById("qs");
function build(){
 box.innerHTML="";
 Q.forEach(function(q,i){
  var d=document.createElement("div");d.className="q";d.id="q"+i;
  var h="<h3><span>"+(i+1)+".</span> "+q[0]+"</h3>";
  q[1].forEach(function(o,j){h+="<label data-j='"+j+"'><input type='radio' name='r"+i+"' value='"+j+"'>"+o+"</label>";});
  h+="<div class='ex'>"+q[3]+"</div>";
  d.innerHTML=h;box.appendChild(d);
 });
}
build();
document.getElementById("go").onclick=function(){
 var s=0,un=0;
 Q.forEach(function(q,i){
  var c=document.querySelector("input[name=r"+i+"]:checked"),d=document.getElementById("q"+i);
  d.querySelectorAll("label").forEach(function(l){
   var j=+l.getAttribute("data-j");
   if(j===q[2])l.classList.add("good");
   if(c&&+c.value===j&&j!==q[2])l.classList.add("bad");
   l.querySelector("input").disabled=true;
  });
  if(!c)un++;
  if(c&&+c.value===q[2]){s++;d.classList.add("ok");}else d.classList.add("ko");
 });
 var n=document.getElementById("nom").value.trim();
 document.getElementById("who").textContent=n?("Élève : "+n):"";
 document.getElementById("note").textContent=s+" / 20";
 document.getElementById("msg").textContent=s>=16?"Excellent travail !":s>=10?"Bien, continue à réviser les points manqués.":"À revoir : relis la fiche et recommence.";
 var r=document.getElementById("res");r.style.display="block";r.scrollIntoView({behavior:"smooth"});
 this.style.display="none";document.getElementById("re").style.display="inline-block";
};
document.getElementById("re").onclick=function(){
 build();document.getElementById("res").style.display="none";
 document.getElementById("go").style.display="inline-block";this.style.display="none";window.scrollTo(0,0);
};
</script>
</body>
</html>
