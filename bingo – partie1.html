.pill{background:#cfe3d6;color:#1d2a3a;border-radius:6px;padding:1px 8px}
.pill.v{background:#8bc34a}
.res{text-align:center;display:none}
.res .big{font-size:2.4rem;font-weight:700;color:var(--pri)}
.btn{font:inherit;background:var(--pri);color:#fff;border:0;border-radius:12px;padding:11px 20px;cursor:pointer;margin-top:10px}

var Q=[
{q:"Pour lancer App Inventor en mode hors ligne, quelle adresse saisit-on dans la barre d’adresse du navigateur ?",o:["http://localhost:8080","http://localhost:8888","http://appinventor.mit.edu"],a:1,w:"On lance Ai2Starter et App Inventor 2 Ultimate en mode administrateur, puis on ouvre Firefox et on saisit http://localhost:8888."},
{q:"Dans l’application Bingo, quel composant permet à l’utilisateur de saisir sa proposition ?",o:["Label1","nouveau_jeu","proposition_utilisateur","resultat"],a:2,w:"« proposition_utilisateur » est la zone de texte où l’utilisateur écrit sa proposition.",post:'<img alt="Composants de l’application Bingo" src="'+IMG_COMP+'">'},
{q:"Quelle propriété choisit-on pour modifier la couleur d’arrière-plan d’un bouton ?",o:["Couleur de texte","Couleur de fond","Image"],a:1,w:"« Couleur de fond » change l’arrière-plan du bouton ; « Couleur de texte » change seulement la couleur de son texte."},
{q:"Pour qu’un label occupe toute la largeur de l’écran, on choisit la largeur :",o:["Automatiquement","Remplir parent"],a:1,w:"« Remplir parent » étire le composant sur toute la largeur de l’écran ; « Automatique » adapte la largeur au contenu."},
{q:"Cette section permet au créateur de l’application de développer le code qui exécutera l’application. Laquelle ?",pre:'<img alt="Panneau Blocs d’App Inventor" src="'+IMG_BLOCS+'">',o:["Designer","Blocs","Émulateur"],a:1,w:"Le mode « Blocs » sert à écrire le programme (contrôle, logique, math, texte, variables…). Le mode « Designer » sert à construire l’interface."},
{q:"Au lancement de l’application, quel bloc d’événement permet de masquer la zone de texte et le bouton « valider » ?",o:["quand Screen1.Initialise","quand nouveau_jeu.Clic","quand valider.Clic"],a:0,w:"Les blocs placés dans « quand Screen1.Initialise » s’exécutent à l’ouverture de l’application.",post:'<div class="blk ev">quand <span class="pill">Screen1</span> .Initialise</div>'},
{q:"Pour cacher un composant, par exemple la zone de texte, on met sa propriété Visible à :",pre:'<div class="blk">mettre <span class="pill">proposition_utilisateur</span> . <span class="pill">Visible</span> à <span class="pill v">…&nbsp;▾</span></div>',o:["faux","vrai"],a:0,w:"Visible = faux cache le composant ; Visible = vrai l’affiche.",post:blk("faux")}
];
var done=0,sc=0,L=["A","B","C","D"];
function render(){var h="";Q.forEach(function(x,i){h+='<section class="card" id="c'+i+'"><h2><span class="num">'+(i+1)+'</span>'+x.q+'</h2>'+(x.pre?'<div class="pre">'+x.pre+'</div>':'')+'<div class="opts">'+x.o.map(function(t,j){return '<button class="opt" data-i="'+i+'" data-j="'+j+'">'+L[j]+'. '+t+'</button>'}).join('')+'</div><div class="fb" id="f'+i+'" aria-live="polite"></div></section>'});document.getElementById("qs").innerHTML=h;document.querySelectorAll(".opt").forEach(function(b){b.onclick=pick})}
function pick(e){var b=e.currentTarget,i=+b.dataset.i,j=+b.dataset.j,x=Q[i],ok=j===x.a;var bs=document.querySelectorAll('#c'+i+' .opt');bs.forEach(function(k){k.disabled=true});bs[x.a].classList.add("ok");if(!ok)b.classList.add("ko");var f=document.getElementById("f"+i);f.className="fb "+(ok?"ok":"ko");f.innerHTML=(ok?"✅ <b>Bravo !</b> ":"❌ <b>Pas tout à fait.</b> La bonne réponse : <b>"+x.o[x.a]+"</b>. ")+x.w+(x.post||"");done++;if(ok)sc++;upd();if(done===Q.length)finish()}
function upd(){document.getElementById("fill").style.width=(done/Q.length*100)+"%";document.getElementById("prog").textContent="Question"+(done>1?"s":"")+" "+done+" / "+Q.length+" répondue"+(done>1?"s":"");document.getElementById("score").textContent="Score : "+sc+" / "+Q.length}
function finish(){var r=document.getElementById("res");r.style.display="block";document.getElementById("big").textContent=sc+" / "+Q.length;document.getElementById("msg").textContent=sc===7?"🎉 Parfait ! Tu maîtrises le début du projet Bingo.":sc>=5?"👏 Très bien ! Encore un petit effort pour atteindre le score parfait.":sc>=3?"💪 Bon début ! Relis la leçon et retente le quiz.":"🌱 Courage ! Relis la leçon et réessaie, tu vas y arriver.";r.scrollIntoView({behavior:"smooth",block:"center"})}
document.getElementById("again").onclick=function(){done=0;sc=0;document.getElementById("res").style.display="none";render();upd();window.scrollTo({top:0,behavior:"smooth"})};
render();upd();
</script></body></html>
