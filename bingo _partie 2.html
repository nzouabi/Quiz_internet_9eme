body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}

.card h2{margin:0 0 10px;font-size:1.05rem}

.opts{display:grid;gap:8px;margin-top:12px}

.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okb)}
.opt.ko{border-color:var(--ko);background:var(--kob)}

.fb.ok{display:block;background:var(--okb)}.fb.ko{display:block;background:var(--kob)}
.fb img,.pre img{max-width:100%;border-radius:10px;border:1px solid var(--line);margin-top:10px;display:block}
.pre{margin:8px 0}
.blk{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;background:#2e7d4f;color:#fff;border:3px solid #f2c230;border-radius:10px;padding:8px 10px;font-size:.95rem}
.blk.ev{background:#c9a23a;border-color:#c9a23a;color:#1d2a3a}
.pill{background:#cfe3d6;color:#1d2a3a;border-radius:6px;padding:1px 8px}
.pill.v{background:#8bc34a}.pill.n{background:#fff;color:#1d2a3a;font-weight:600}.blk.var{background:#d4622a}.mth{background:#3f77b6;color:#fff;border-radius:8px;padding:3px 8px;display:inline-flex;gap:6px;align-items:center;border:2px solid #2f5f96}
.res{text-align:center;display:none}
.res .big{font-size:2.4rem;font-weight:700;color:var(--pri)}
.btn{font:inherit;background:var(--pri);color:#fff;border:0;border-radius:12px;padding:11px 20px;cursor:pointer;margin-top:10px}
